<table mat-table [dataSource]="entities()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name / callsign</th>
    <td mat-cell *matCellDef="let item">{{ item.name }}</td></ng-container
  >
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let item">{{ item.type }}</td></ng-container
  >
  <ng-container matColumnDef="taskForce">
    <th mat-header-cell *matHeaderCellDef>Task force</th>
    <td mat-cell *matCellDef="let item">{{ item.taskForce }}</td></ng-container
  >
  <ng-container matColumnDef="latitude">
    <th mat-header-cell *matHeaderCellDef>Latitude</th>
    <td mat-cell *matCellDef="let item">{{ item.latitude }}</td></ng-container
  >
  <ng-container matColumnDef="longitude">
    <th mat-header-cell *matHeaderCellDef>Longitude</th>
    <td mat-cell *matCellDef="let item">{{ item.longitude }}</td></ng-container
  >
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
