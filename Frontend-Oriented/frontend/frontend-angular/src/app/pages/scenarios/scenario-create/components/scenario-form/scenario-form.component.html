<mat-card
  ><mat-card-content
    ><form [formGroup]="form" (ngSubmit)="submit()">
      @if (serverError()) {
        <mat-error>{{ serverError() }}</mat-error>
      }
      <mat-form-field
        ><mat-label>Scenario name</mat-label
        ><input matInput formControlName="name" maxlength="200" />
        @if (form.controls.name.hasError('required')) {
          <mat-error>Name is required.</mat-error>
        }
        <mat-hint align="end">{{ form.controls.name.value.length }}/200</mat-hint></mat-form-field
      >
      <mat-form-field
        ><mat-label>Description</mat-label
        ><textarea matInput formControlName="description" maxlength="1000" rows="6"></textarea
        ><mat-hint align="end"
          >{{ form.controls.description.value.length }}/1000</mat-hint
        ></mat-form-field
      >
      <mat-card-actions align="end"
        ><button
          matButton="outlined"
          type="button"
          [disabled]="submitting()"
          (click)="cancelled.emit()"
        >
          Cancel</button
        ><button matButton="filled" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Creating…' : 'Create scenario' }}
        </button></mat-card-actions
      >
    </form></mat-card-content
  ></mat-card
>
