@if (loading()) {
  <app-loading-state />
} @else if (error()) {
  <app-error-state [message]="error()!" (retry)="load()" />
} @else if (scenario(); as currentScenario) {
  <app-scenario-header [scenario]="currentScenario" />
  <section class="entities-heading">
    <div>
      <h2 class="mat-headline-medium">Entities</h2>
      <p>{{ totalCount() }} total</p>
    </div>
  </section>
  @if (totalCount() === 0 && !query() && !type() && !taskForce()) {
    <app-empty-state title="No entities yet" message="Add the first entity to this scenario.">
      <a matButton="filled" [routerLink]="['/scenarios', scenarioId, 'entities', 'create']"
        >Create entity</a
      >
    </app-empty-state>
  } @else {
    <app-entity-filters
      [query]="query()"
      [type]="type()"
      [taskForce]="taskForce()"
      [sort]="sort()"
      (queryChange)="search($event)"
      (typeChange)="changeType($event)"
      (taskForceChange)="changeTaskForce($event)"
      (sortChange)="changeSort($event)"
    />
    @if (entities().length === 0) {
      <app-empty-state title="No matching entities" message="Try changing the active filters." />
    } @else {
      <app-entity-table [entities]="entities()" />
      <mat-paginator
        [length]="totalCount()"
        [pageIndex]="page() - 1"
        [pageSize]="pageSize()"
        [pageSizeOptions]="[10, 20, 50, 100]"
        (page)="changePage($event)"
      />
    }
  }
}
